# Publica o app web (Flutter) no GitHub Pages a cada push na main que mexa
# no flutter_frontend. Também dá pra rodar na mão: aba Actions → este
# workflow → "Run workflow".
#
# Endereço do backend: variável do repositório API_URL
# (Settings → Secrets and variables → Actions → Variables). Sem ela, o site
# procura o backend em http://127.0.0.1:8000 — ou seja, no computador de
# quem abre o site (só funciona pra quem estiver rodando o backend local).
name: Publicar app web (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'flutter_frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# só uma publicação por vez; uma nova cancela a anterior
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9 # mesma versão usada no desenvolvimento
          cache: true

      - run: flutter pub get

      - run: flutter test

      # base-href = nome do repositório, porque o site fica em
      # https://<usuario>.github.io/<repositorio>/
      - run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=API_URL=${{ vars.API_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: flutter_frontend/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
