# Configuração do backend no Render (https://render.com) — "Blueprint".
# No Render: New → Blueprint → escolher este repositório → Apply.
# Ele lê este arquivo, instala o backend e deixa a API num endereço como
# https://mojiki-api.onrender.com
#
# Plano grátis: o servidor "dorme" depois de ~15 min sem uso (o primeiro
# acesso depois disso demora ~30-50 s) e o disco não é permanente — o
# banco SQLite volta ao estado inicial (vazio) quando o
# servidor reinicia ou é publicado de novo.
services:
  - type: web
    name: mojiki-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # $PORT é a porta que o Render escolhe; 0.0.0.0 = aceita conexões de fora
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /decks
    autoDeploy: true # publica de novo a cada push na main
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10 # testado: requirements.txt instala e os testes passam
      # banco próprio do servidor online, criado do zero (vazio) —
      # NÃO usa o backend/flashcards.db do repositório, que tem
      # os dados de quem desenvolve
      - key: MOJIKI_DB
        value: /tmp/mojiki_online.db
